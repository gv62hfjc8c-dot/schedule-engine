name: Schedule Engine V2 — foundation
on:
  push:
    branches:
      - "v2/**"
  pull_request:
    branches:
      - main
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
